<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>e-Fatura Görüntüleyici</title>
  <link rel="icon" href="simgeler/simge-32.png">
  <link rel="stylesheet" href="ortak.css">
  <link rel="stylesheet" href="viewer.css">
  <script type="module" src="viewer.js"></script>
</head>
<body>
  <header class="arac-cubugu" id="aracCubugu" hidden>
    <div class="baslik">
      <div class="dosya-adi" id="dosyaAdi"></div>
      <div class="not" id="not" role="status" hidden></div>
    </div>
    <div class="dugmeler">
      <span class="sablon-adi" id="sablonAdi" hidden></span>
      <button type="button" id="sablonDugmesi" class="ikincil" hidden></button>
      <button type="button" id="gorunumDugmesi" class="ikincil" hidden></button>
      <button type="button" id="baskaDosyaDugmesi" class="ikincil" data-i18n="aracBaskaDosya"></button>
      <button type="button" id="yazdirDugmesi" class="birincil" data-i18n="aracYazdir" hidden></button>
    </div>
  </header>

  <main id="icerik">
    <section class="acilis" id="acilis" hidden>
      <div class="birakma-alani" id="birakmaAlani">
        <svg class="acilis-simge" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M12 4h18l10 10v30H12z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M30 4v10h10M18 24h16M18 30h16M18 36h10" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        <h1 data-i18n="acilisBaslik"></h1>
        <p data-i18n="acilisAlt"></p>
        <label class="birincil dosya-sec">
          <span data-i18n="dosyaSec"></span>
          <input type="file" id="dosyaGirdisi" accept=".xml,application/xml,text/xml" multiple>
        </label>
        <p class="ag-notu" data-i18n="popupAgNotu"></p>
      </div>
    </section>

    <p class="yukleniyor" id="yukleniyor" data-i18n="yukleniyor"></p>

    <!-- Fatura: şablon gönderenden gelir; betik çalıştıramaz, uzantıya erişemez -->
    <iframe id="faturaCercevesi" class="fatura" sandbox="" title="" hidden></iframe>

    <pre id="hamXml" class="ham-xml" hidden></pre>
  </main>

  <input type="file" id="ikinciGirdi" accept=".xml,application/xml,text/xml" multiple hidden>
  <div class="surukle-ortusu" id="surukleOrtusu" hidden><span data-i18n="acilisBaslik"></span></div>
</body>
</html>
